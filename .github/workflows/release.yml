name: Auto-Release EXE

# Das Skript startet, wenn du auf GitHub einen Knopf drückst (Run workflow)
on:
  workflow_dispatch:

# GitHub braucht die Erlaubnis, neue Dateien bei dir hochzuladen (für das Release)
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 📥 Code herunterladen
        uses: actions/checkout@v4

      - name: ☕ Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26' # Korrekt auf deine installierte Version 26 gesetzt!

      - name: 🔨 JAR-Datei bauen (mit NetBeans Ant)
        run: ant -f build.xml clean jar

      - name: 🚀 Launch4j herunterladen
        run: |
          curl -L -o launch4j.zip "https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-win32.zip/download"
          tar -xf launch4j.zip
        shell: cmd
        
      - name: 📦 EXE mit Launch4j erstellen
        # WICHTIG: Die launch4j-config.xml muss zwingend in deinem GitHub-Repository liegen!
        run: launch4j\launch4jc.exe launch4j-config.xml
        shell: cmd

      - name: 🌐 Release auf GitHub veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "FeuerwehrVerwaltung v${{ github.run_number }}"
          files: FeuerwehrVerwaltung.exe